{% extends "base.html" %}
{% block title %}เกิดข้อผิดพลาด{% endblock %}
{% block content %}
<style>
    .error-wrap { max-width: 420px; margin: 40px auto 0; text-align: center; }
    .error-wrap .card { border-top: 4px solid var(--danger); }
    .error-code {
        font-family: var(--font-mono);
        font-size: 3.2em;
        font-weight: 700;
        color: var(--danger);
        line-height: 1;
        margin-bottom: 10px;
    }
</style>

<div class="error-wrap">
    <div class="card">
        <div class="error-code">{{ code }}</div>
        <h2>ไม่สามารถดำเนินการต่อได้</h2>
        <p class="muted">{{ message }}</p>
        <a class="btn" href="{{ url_for('index') }}">กลับหน้าแรก</a>
    </div>
</div>
{% endblock %}
